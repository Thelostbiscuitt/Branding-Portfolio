# Habibcore — Cloudflare Pages project (brutalist static build)
# Deploy: `npx wrangler pages deploy site --project-name habibcore`
name = "habibcore"
compatibility_date = "2025-09-01"
pages_build_output_dir = "./site"

# Habibcore Sound — the 10-track deck streams from R2 (zero egress, Range-aware)
# via the Pages Function at functions/Music/[file].js.
[[r2_buckets]]
binding = "SOUND_BUCKET"
bucket_name = "habibcore-sound"

# Enquiry endpoint — functions/api/contact.js delivers the contact form through
# Resend. The API key is a Pages SECRET, not a var:
#     npx wrangler pages secret put RESEND_API_KEY
