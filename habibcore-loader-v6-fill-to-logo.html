<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HABIBCORE Loader — fill to mark</title>
<style>
  :root {
    --loader-bg:#101010;
    --white:#f5f5f3;
    --ghost:#2c2c2c;
    --readout:#8b8b8b;
    --load-ms:4600ms;
    --zoom-ms:440ms;
  }
  *{box-sizing:border-box}
  html,body{width:100%;height:100%;margin:0}
  body{overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#f2ede3}

  /* Demo page only. In HABIBCORE this is simply the existing portfolio underneath. */
  .portfolio-demo{position:fixed;inset:0;background:#f2ede3;color:#121212;padding:clamp(22px,3vw,46px);display:flex;flex-direction:column;justify-content:space-between}
  .portfolio-demo .top{display:flex;justify-content:space-between;font:700 11px/1.2 "Courier New",monospace;letter-spacing:.14em}
  .portfolio-demo .hero{font:900 clamp(56px,11vw,170px)/.82 Arial,Helvetica,sans-serif;letter-spacing:-.075em;text-transform:uppercase;max-width:10ch}
  .portfolio-demo .foot{font:700 10px/1.2 "Courier New",monospace;letter-spacing:.14em}

  .loader{position:fixed;inset:0;z-index:9999;background:var(--loader-bg);display:grid;place-items:center;overflow:hidden;isolation:isolate}
  .loader.is-opening{opacity:0;transition:opacity 110ms linear;pointer-events:none}
  .stage{position:relative;width:100%;height:100%;display:grid;place-items:center;overflow:hidden}

  .lockup{position:relative;transform:translateY(-1.5vh);display:grid;place-items:center}
  .visual{display:flex;flex-direction:column;align-items:center;justify-content:center;white-space:nowrap}
  .visual.fill{position:absolute;inset:0;clip-path:inset(100% 0 0 0);will-change:clip-path}

  .mark{width:clamp(58px,5.4vw,96px);height:auto;display:block;margin-bottom:clamp(22px,2.25vw,38px);object-fit:contain}
  .base .mark{opacity:.18}
  .fill .mark{opacity:1}

  .word{font-family:"DejaVu Sans","Arial Black","Helvetica Neue",Arial,sans-serif;font-size:clamp(50px,8.15vw,138px);font-weight:900;letter-spacing:-.065em;line-height:.83;text-transform:uppercase;white-space:nowrap}
  .base .word{color:var(--ghost)}
  .fill .word{color:var(--white)}

  .readout{position:absolute;right:-.2em;bottom:-2.05em;font:700 clamp(7px,.62vw,11px)/1.1 "Courier New",monospace;letter-spacing:.14em;color:var(--readout);white-space:nowrap;text-transform:uppercase;transition:opacity 130ms linear}
  .readout b{color:#bcbcbc}

  .zoom-mark{position:fixed;z-index:4;display:block;opacity:0;pointer-events:none;will-change:transform,opacity;transform-origin:center center}

  .loader.is-complete .visual,.loader.is-complete .readout{opacity:0;transition:opacity 110ms linear}

  @media(max-width:640px){
    .word{font-size:clamp(42px,11vw,72px);letter-spacing:-.07em}
    .mark{width:58px;margin-bottom:24px}
    .readout{bottom:-2.5em;font-size:7px}
    .portfolio-demo .hero{font-size:18vw}
  }
  @media(prefers-reduced-motion:reduce){
    .loader{display:none}
    body{overflow:auto}
  }
</style>
</head>

<script>
(() => {
  const loader = document.getElementById('loader');
  const fillLayer = document.getElementById('fillLayer');
  const filledMark = document.getElementById('filledMark');
  const zoomMark = document.getElementById('zoomMark');
  const pct = document.getElementById('pct');

  const LOAD = 4600;
  const ZOOM = 440;
  const start = performance.now();
  let completed = false;

  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

  function finish() {
    if (completed) return;
    completed = true;
    pct.textContent = '100%';
    fillLayer.style.clipPath = 'inset(0% 0 0 0)';

    // The fill has reached the top of the transparent mark. Zoom immediately.
    requestAnimationFrame(() => {
      const r = filledMark.getBoundingClientRect();
      zoomMark.style.left = r.left + 'px';
      zoomMark.style.top = r.top + 'px';
      zoomMark.style.width = r.width + 'px';
      zoomMark.style.height = r.height + 'px';
      zoomMark.style.opacity = '1';
      loader.classList.add('is-complete');

      const scale = Math.max(innerWidth / r.width, innerHeight / r.height) * 1.55;
      const anim = zoomMark.animate([
        { transform:'scale(1)', opacity:1 },
        { transform:`scale(${scale})`, opacity:1 }
      ], { duration:ZOOM, easing:'cubic-bezier(.16,1,.3,1)', fill:'forwards' });

      anim.finished.then(() => {
        loader.classList.add('is-opening');
        document.body.style.overflow = 'auto';
        document.body.classList.add('habibcore-loaded');
        window.dispatchEvent(new CustomEvent('habibcore:loader-complete'));
        setTimeout(() => loader.remove(), 120);
      });
    });
  }

  function tick(now) {
    if (completed) return;
    const t = Math.min(1, (now - start) / LOAD);
    // Readout and physical fill stay synchronized: 37% means the lockup is 37% filled.
    const shown = Math.round(t * 100);
    const p = t;
    fillLayer.style.clipPath = `inset(${(1 - p) * 100}% 0 0 0)`;
    pct.textContent = String(shown).padStart(2,'0') + '%';
    if (t < 1) requestAnimationFrame(tick); else finish();
  }

  requestAnimationFrame(tick);
})();
</script>
