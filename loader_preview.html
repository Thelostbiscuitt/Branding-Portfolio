<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HABIBCORE — loader preview (v4.1)</title>
<style>
  :root { --ink:#0b0b0c; --paper:#f4f2ed; --dim:#262628; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--paper); font-family:Arial, sans-serif; }
  /* ===== mock site underneath (stand-in for the real portfolio) ===== */
  .site { height:100vh; display:flex; align-items:flex-end; padding:28px;
          background:var(--paper); color:var(--ink); }
  .site h1 { font-size:clamp(40px,8vw,110px); font-weight:900; letter-spacing:-.04em; }
  /* ===== loader overlay ===== */
  .loader { position:fixed; inset:0; z-index:999; background:var(--hc-surface-ink, #0b0b0c);
            display:flex; align-items:center; justify-content:center;
            transition:opacity .5s ease; }
  .loader.done { opacity:0; pointer-events:none; }
  .ld-stage { position:relative; width:min(78vw,900px); transition:transform .9s cubic-bezier(.7,0,.84,0); }
  .loader.zoom .ld-stage { transform:scale(9); }
  .ld-stage svg { display:block; width:100%; height:auto; overflow:visible; }
  .ld-dim  { color:var(--dim); }
  .ld-white{ color:var(--paper); }
  .ld-count { position:absolute; right:0; bottom:-18px;
              font-family:'IBM Plex Mono', monospace; font-size:11px;
              letter-spacing:.14em; color:var(--paper); opacity:.9;
              font-variant-numeric:tabular-nums; }
  .ld-count b { font-weight:400; }
  .replay { position:fixed; bottom:22px; right:22px; z-index:1000;
            font-family:monospace; font-size:12px; letter-spacing:.12em;
            background:var(--paper); color:var(--ink); border:0;
            padding:10px 16px; border-radius:999px; cursor:pointer; }
</style>
</head>
<body>

    <div class="ld-count" id="count"><b>loading… 0%</b></div>
  </div>
</div>
<button class="replay" id="replay">↻ REPLAY LOADER</button>

<script>
const DUR = 3400, WASHES = 2.6;
const loader = document.getElementById('loader'),
      stage  = document.getElementById('stage'),
      count  = document.getElementById('count'),
      wave   = document.getElementById('wavePath');
const ease = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
function setProgress(p){                       // p: 0..1
  if (p >= 1) return exit();
  const c = p * WASHES;
  const osc = (1 - Math.cos(2*Math.PI*c)) / 2; // 0→1→0→1 waterline cycles
  let top = -4 + 86 * osc;                     // waterline in glyph space (caps ~8, baseline ~77)
  if (p > .92) top = -4 + 86 * (1 - ease((p-.92)/.08));
  const phase = p * 26, amp = 3.2;
  let d = '';
  for (let i=0;i<=28;i++){ const x=-6+(343/28)*i;
    const y = top + Math.sin(i*.62+phase)*amp;
    d += (i? 'L':'M') + x.toFixed(1) + ' ' + y.toFixed(1) + ' '; }
  wave.setAttribute('d', d + 'L337 82L-6 82Z');
  count.innerHTML = '<b>loading… ' + Math.floor(p*100) + '%</b>';
}
function exit(){
  setProgressStatic();
  loader.classList.add('zoom');
  setTimeout(()=>{ loader.classList.add('done'); }, 620);
}
function setProgressStatic(){
  wave.setAttribute('d','M-6 -4L337 -4L337 82L-6 82Z');
  count.innerHTML = '<b>loading… 100%</b>';
}
let t0 = performance.now();
(function tick(now){
  const p = Math.min(1, (now - t0)/DUR);
  if (!loader.classList.contains('zoom')) setProgress(p);
  if (p < 1) requestAnimationFrame(tick);
})(t0);
function replay(){ loader.classList.remove('done','zoom');
  t0 = performance.now(); requestAnimationFrame(function tick(now){
    const p = Math.min(1,(now-t0)/DUR);
    if (!loader.classList.contains('zoom')) setProgress(p);
    if (p<1) requestAnimationFrame(tick);
  }); }
document.getElementById('replay').onclick = replay;
window.__setProgress = p => { t0 = performance.now() - p*DUR; setProgress(Math.min(p,1)); };
</script>

</html>
