# nginx — HABIBCORE® static build (v3.3 PORT)
# Replaces the Next.js pm2 proxy. Static site, hash routing — no rewrites needed.
server {
    listen 80;
    server_name habibcore.com www.habibcore.com;

    root /var/www/habibcore-static;
    index index.html;

    # gzip for text assets
    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # long cache for media (filenames are stable), short for the html
    location /media/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location / {
        expires 1h;
        try_files $uri $uri/ /index.html;
    }

    # real 404 page (ink plate)
    error_page 404 /404.html;

    # generous upload/stream limits for the video figures
    client_max_body_size 0;
    sendfile on;
    tcp_nopush on;
}
