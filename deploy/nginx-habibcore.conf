# nginx reverse proxy for the Habibcore portfolio (Next.js on :3000)
# install with:
#   sudo cp deploy/nginx-habibcore.conf /etc/nginx/sites-available/habibcore
#   sudo ln -s /etc/nginx/sites-available/habibcore /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# then run certbot for HTTPS:  sudo certbot --nginx -d habibcore.com -d www.habibcore.com

server {
    listen 80;
    listen [::]:80;
    server_name habibcore.com www.habibcore.com;

    # gzip — the site is text-heavy (CSS/JS/SVG)
    gzip on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # immutable Next.js build assets
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # self-hosted fonts
    location /fonts/ {
        proxy_pass http://127.0.0.1:3000;
        expires 365d;
        add_header Cache-Control "public";
    }

    # everything else → Next.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    client_max_body_size 10m;
}
